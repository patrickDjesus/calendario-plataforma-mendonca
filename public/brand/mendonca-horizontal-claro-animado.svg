  </defs>
  <!-- Icon squircle -->
  <rect x="10" y="10" width="100" height="100" rx="24" fill="url(#mendoncaGradHorizAnim)"/>
  <path d="M 35 76 L 35 44 L 60 70 L 85 44 L 85 76" fill="none" stroke="#FFFFFF" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line className="anim-line" x1="35" y1="86" x2="85" y2="86" stroke="#C084FC" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Typography -->
  <text x="126" y="48" font-family="Plus Jakarta Sans, system-ui, -apple-system, sans-serif" font-weight="600" font-size="30" fill="#7C3AED" letter-spacing="-0.5">Plataforma</text>
  <text x="126" y="94" font-family="Plus Jakarta Sans, system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" fill="#0F172A" letter-spacing="-1">Mendonça</text>
