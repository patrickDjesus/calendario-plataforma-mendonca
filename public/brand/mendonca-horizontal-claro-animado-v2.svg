<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 152" width="740" height="304" role="img" aria-label="Plataforma Mendonça" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
/* ---------- Linha do tempo ----------
 0.00s  logo surge no centro e desenha o M
 1.75s  brilho cruza o ícone
 2.50s  logo desliza para a esquerda; o texto sai de dentro dela
 3.85s  chapéu de formando cai sobre a logo
 4.37s  impacto: ícone "afunda", borla balança, brilhos
------------------------------------------ */
.tile{transform-box:fill-box;transform-origin:center;animation:tile .45s cubic-bezier(.2,.8,.2,1) both}
.base,.m{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round}
.base{stroke-opacity:.55;stroke-width:22;animation:draw .75s cubic-bezier(.4,0,.2,1) .3s both}
.m{stroke-width:44;animation:draw 1.1s cubic-bezier(.65,0,.35,1) .6s both}

.shine{animation:shine .8s cubic-bezier(.45,0,.25,1) 1.75s both}

.slide{animation:slide 1.1s cubic-bezier(.65,0,.25,1) 2.5s both}
.t1{animation:out1 1.05s cubic-bezier(.22,.9,.3,1) 2.55s both}
.t2{animation:out2 1.05s cubic-bezier(.22,.9,.3,1) 2.68s both}

.hit{animation:hit .6s cubic-bezier(.2,.7,.3,1) 4.37s both}
.cap{animation:cap 1s linear 3.85s both,show .05s linear 3.85s both}
.tassel{animation:swing 1.7s ease-in-out 4.3s both}
.spark{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:spark .75s cubic-bezier(.3,.7,.3,1) both}
.s1{animation-delay:4.45s}.s2{animation-delay:4.62s}

@keyframes tile{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes draw{from{stroke-dasharray:1 1;stroke-dashoffset:1;opacity:0}1%{opacity:1}to{stroke-dasharray:1 1;stroke-dashoffset:0;opacity:1}}
@keyframes shine{to{transform:translateX(900px)}}
@keyframes slide{from{transform:translateX(137px)}to{transform:translateX(0)}}
@keyframes out1{from{transform:translateX(-185px)}to{transform:translateX(0)}}
@keyframes out2{from{transform:translateX(-280px)}to{transform:translateX(0)}}
@keyframes show{from{opacity:0}to{opacity:1}}
@keyframes cap{
  0%{transform:translateY(-190px) rotate(24deg);animation-timing-function:cubic-bezier(.5,0,.9,.6)}
  52%{transform:translateY(3px) rotate(-3deg);animation-timing-function:cubic-bezier(.2,.7,.3,1)}
  68%{transform:translateY(-9px) rotate(2deg);animation-timing-function:ease-in}
  80%{transform:translateY(1px) rotate(-.8deg);animation-timing-function:ease-out}
  90%{transform:translateY(-2.5px) rotate(.3deg);animation-timing-function:ease-in-out}
  100%{transform:translateY(0) rotate(0)}
}
@keyframes hit{
  0%{transform:scale(1,1)}
  25%{transform:scale(1.03,.955)}
  55%{transform:scale(.995,1.015)}
  100%{transform:scale(1,1)}
}
@keyframes swing{
  0%{transform:rotate(0)}
  20%{transform:rotate(16deg)}
  45%{transform:rotate(-11deg)}
  68%{transform:rotate(6deg)}
  85%{transform:rotate(-2.5deg)}
  100%{transform:rotate(0)}
}
@keyframes spark{
  0%{transform:scale(0) rotate(-45deg);opacity:1}
  45%{transform:scale(1) rotate(0);opacity:1}
  100%{transform:scale(0) rotate(45deg);opacity:1}
}
@media (prefers-reduced-motion:reduce){
  .tile,.base,.m,.shine,.slide,.t1,.t2,.hit,.cap,.tassel,.spark{animation:none}
  .spark{opacity:0}
}
</style>
<defs>
  <linearGradient id="g" x1="0" y1="512" x2="512" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4338ca"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
  <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".38"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="tileclip"><rect width="512" height="512" rx="116"/></clipPath>
  <!-- só mostra o que está à direita da borda da logo (acompanha o deslize) -->
  <clipPath id="fromTile"><rect x="90" y="-100" width="600" height="320"/></clipPath>
</defs>

<g transform="translate(0 56)">

  <!-- Texto (fica ATRÁS da logo e sai de dentro dela) -->
