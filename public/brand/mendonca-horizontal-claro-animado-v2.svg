  </g></g>

  <!-- Logo -->
  <g class="slide">
    <g transform="translate(48 96)"><g class="hit"><g transform="translate(-48 -96)">
      <svg x="0" y="0" width="96" height="96" viewBox="0 0 512 512">
        <rect class="tile" width="512" height="512" rx="116" fill="url(#g)"/>
        <g transform="translate(2,-4)">
          <path class="m" pathLength="1" d="M132 340V190L254 312L376 128V340"/>
          <path class="base" pathLength="1" d="M123 403H389"/>
        </g>
        <g clip-path="url(#tileclip)"><g transform="skewX(-20)"><rect class="shine" x="-260" y="-20" width="170" height="560" fill="url(#sh)"/></g></g>
      </svg>
    </g></g></g>
  </g>

