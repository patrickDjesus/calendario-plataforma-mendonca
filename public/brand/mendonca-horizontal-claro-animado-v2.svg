238.58 21.88 236.37 21.88C234.5 21.88 233.34 22.45 232.21 23.93V22.23H230.21ZM255.57 29.66C255.57 34.06 258.94 37.35 263.48 37.35C265.99 37.35 267.61 36.51 269.18 34.41V37H271.18V22.23H269.18V24.85C267.72 22.8 265.91 21.88 263.35 21.88C258.92 21.88 255.57 25.23 255.57 29.66ZM257.59 29.52C257.59 26.31 260.19 23.72 263.4 23.72C266.64 23.72 269.18 26.25 269.18 29.55C269.18 32.9 266.69 35.52 263.51 35.52C260.16 35.52 257.59 32.9 257.59 29.52Z" fill="#6366f1"/></g>
